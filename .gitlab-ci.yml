stages:
  - deploy

deploy_to_vps:
  stage: deploy
  only:
    - master
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh git
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo "$VPS_SSH_KEY_PASSPHRASE" | ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts

  script:
    - ssh $VPS_USER@$VPS_HOST "
        cd $VPS_PATH &&
        git pull origin master &&
        npm install &&
        npx prisma migrate deploy &&
        npm run build &&
        pm2 restart 0
      "