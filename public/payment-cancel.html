<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Cancelled</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Arial", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cancel-card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.6s ease-in-out;
    }

    .crossmark {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #e53935;
      margin: 0 auto 20px;
      position: relative;
    }

    .crossmark::before,
    .crossmark::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 45px;
      height: 6px;
      background: #fff;
      border-radius: 3px;
    }

    .crossmark::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .crossmark::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    h1 {
      font-size: 26px;
      color: #b71c1c;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .info {
      background: #fdecea;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 14px;
      color: #333;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 26px;
      border-radius: 30px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    .btn.retry {
      background: #e53935;
      color: #fff;
    }

    .btn.retry:hover {
      background: #d32f2f;
    }

    .btn.back {
      border: 2px solid #e53935;
      color: #e53935;
      background: transparent;
    }

    .btn.back:hover {
      background: #fdecea;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="cancel-card">
    <div class="crossmark"></div>

    <h1>Payment Cancelled</h1>
    <p>
      Your payment was cancelled or failed to process.
      No money has been charged from your account.
    </p>

    <div class="info">
      If the amount was deducted, it will be automatically refund.
    </div>

  </div>

</body>
</html>
