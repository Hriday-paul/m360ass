<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Arial", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
     
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.6s ease-in-out;
    }

    .checkmark {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #4caf50;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .checkmark::after {
      content: "";
      width: 25px;
      height: 45px;
      border-right: 6px solid #fff;
      border-bottom: 6px solid #fff;
      transform: rotate(45deg);
      position: absolute;
      animation: draw 0.5s ease forwards;
    }

    h1 {
      font-size: 26px;
      color: #2e7d32;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: #4caf50;
      color: #fff;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #43a047;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes draw {
      from {
        height: 0;
        width: 0;
        opacity: 0;
      }
      to {
        height: 45px;
        width: 25px;
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="success-card">
    <!-- <div class="checkmark"></div> -->

    <div>
        <img src="./success.gif" alt="success image"/>
    </div>

    <h1>Payment Successful</h1>
    <p>
      Thank you! Your payment has been processed successfully.
      A confirmation email has been sent to you.
    </p>

    <!-- <a href="#" class="btn">Go to Dashboard</a> -->
  </div>

</body>
</html>
